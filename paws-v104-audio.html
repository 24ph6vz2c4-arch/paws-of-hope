<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paws of Hope • 1.04 Audio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bdd7dc}iframe{display:block;width:100%;height:100%;border:0}</style></head>
<body><iframe id="game" title="Paws of Hope" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
'use strict';
// Original synthesized music and effects. No external audio assets.
const frame=document.getElementById('game');
let cleanup=()=>{};
function attach(){
 cleanup();let d,w;
 try{d=frame.contentDocument;w=frame.contentWindow;if(!d||!d.body||!w.location.pathname.endsWith('paws-v103-community.html'))return;}catch{return;}
 let ctx,master,musicBus,fxBus,noise,playing=false,effects=false,timer=null,step=0,next=0,ambient=0,alive=true;
 const disposers=[];
 function listen(t,n,f,o){t.addEventListener(n,f,o);disposers.push(()=>t.removeEventListener(n,f,o));}
 function init(){if(ctx)return;ctx=new (w.AudioContext||w.webkitAudioContext)();master=ctx.createGain();master.gain.value=.65;master.connect(ctx.destination);musicBus=ctx.createGain();musicBus.gain.value=0;musicBus.connect(master);fxBus=ctx.createGain();fxBus.gain.value=0;fxBus.connect(master);noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const a=noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 function gain(bus,on){const t=ctx.currentTime;bus.gain.cancelScheduledValues(t);bus.gain.setTargetAtTime(on?1:0,t,.045);}
 function tone(bus,f,t,len,v=.08,type='sine',end=f){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(25,end),t+len);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.025,len*.25));g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(bus);o.start(t);o.stop(t+len+.02);}
 function rustle(t,len,filter,f,v=.1,end=f){const n=ctx.createBufferSource(),b=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=noise;n.loop=true;b.type=filter;b.frequency.setValueAtTime(f,t);b.frequency.exponentialRampToValueAtTime(Math.max(40,end),t+len);b.Q.value=.8;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.018,len*.25));g.gain.exponentialRampToValueAtTime(.0001,t+len);n.connect(b);b.connect(g);g.connect(fxBus);n.start(t,Math.random()*.5);n.stop(t+len+.02);}
 const hz=n=>440*Math.pow(2,(n-69)/12);
 const chords=[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59],[48,55,60,64],[45,52,57,64],[41,48,53,60],[43,50,55,62]];
 const melody=[[72,76,null,79,76,null,74,null],[72,null,69,72,null,76,74,null],[69,72,null,77,76,null,72,null],[71,null,74,76,74,null,67,null],[72,76,null,79,81,null,79,null],[76,null,72,69,null,72,76,null],[77,76,null,72,69,null,72,null],[74,null,71,67,71,null,74,null]];
 function pluck(m,t,v,len){const f=hz(m);tone(musicBus,f,t,len,v);tone(musicBus,f*2,t,len*.58,v*.22);tone(musicBus,f*3,t,len*.32,v*.07);}
 function score(t,i){const bar=Math.floor(i/8)%8,j=i%8,c=chords[bar];if(j===0||j===4)pluck(c[0],t,.047,1.2);pluck(c[[1,2,3,2,1,2,3,2][j]],t,.028,.85);const m=melody[bar][j];if(m!==null)pluck(m,t,.065,.95);}
 function bark(t){tone(fxBus,190,t,.13,.047,'triangle',105);rustle(t,.13,'bandpass',750,.095,430);tone(fxBus,240,t+.19,.11,.037,'triangle',130);rustle(t+.19,.12,'bandpass',820,.075,490);}
 function bird(t){tone(fxBus,1850,t,.11,.022,'sine',2580);tone(fxBus,2420,t+.16,.13,.018,'sine',1650);}
 function bell(t,notes){notes.forEach((m,i)=>tone(fxBus,hz(m),t+i*.115,.36,.055));}
 function effect(k){if(!effects||!ctx||ctx.state!=='running'||d.hidden||document.hidden)return;const t=ctx.currentTime+.015;switch(k){case 'feed':for(let i=0;i<6;i++)rustle(t+i*.09,.075,'bandpass',1100+Math.random()*600,.11);break;case 'water':for(let i=0;i<7;i++)rustle(t+i*.11,.10,'bandpass',1700+Math.random()*1100,.095,600);break;case 'clean':for(let i=0;i<3;i++)rustle(t+i*.18,.17,'highpass',700,.075,1300);break;case 'pet':case 'walk':bark(t);break;case 'vet':bell(t,[72,76]);break;case 'comfort':rustle(t,.38,'lowpass',500,.06,200);break;case 'adopt':bell(t,[67,72,76,79,84]);break;case 'rescue':bark(t);bell(t+.48,[72,76]);break;case 'day':bell(t,[60,64,67,72]);break;default:tone(fxBus,620,t,.075,.028,'sine',830);}}
 function tick(){if(!alive||!ctx||ctx.state!=='running'||d.hidden||document.hidden)return;const t=ctx.currentTime;if(playing){if(next<t)next=t+.04;while(next<t+.12){score(next,step++%64);next+=.43;}}if(effects&&t>=ambient){ambient=t+8+Math.random()*10;if(Math.random()<.8)bird(t+.03);else bark(t+.03);}}
 const style=d.createElement('style');style.textContent='.paws-audio-controls{display:flex;gap:4px;align-items:center;pointer-events:auto}.paws-audio-controls button{min-width:40px;min-height:38px;padding:6px 9px!important;background:#fff9e8ed!important;color:#244d3d!important;border:1px solid #244d3d33!important;font-size:16px!important;touch-action:manipulation}.paws-audio-controls button[aria-pressed=true]{background:#d0e8d1!important;border-color:#588567!important}.paws-audio-fallback{position:fixed;z-index:30;right:max(10px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}';d.head.append(style);
 const controls=d.createElement('div');controls.className='paws-audio-controls';const music=d.createElement('button'),fx=d.createElement('button');music.type=fx.type='button';controls.append(music,fx);const old=d.getElementById('sound');if(old&&old.parentElement){old.style.setProperty('display','none','important');old.insertAdjacentElement('afterend',controls);}else{controls.classList.add('paws-audio-fallback');d.body.append(controls);}
 function labels(){const en=d.documentElement.lang==='en';for(const [b,on,icon,pl,eng] of [[music,playing,'♫','Muzyka','Music'],[fx,effects,effects?'🔊':'🔇','Dźwięki','Sound effects']]){b.textContent=icon;b.setAttribute('aria-pressed',String(on));b.title=(en?eng:pl)+(on?' ✓':' ✕');b.setAttribute('aria-label',b.title);}}labels();
 async function toggle(k){try{init();await ctx.resume();if(!alive)return;if(k==='music'){playing=!playing;if(playing){next=ctx.currentTime+.04;step=0;}}else{effects=!effects;if(effects)ambient=ctx.currentTime+6;}gain(musicBus,playing);gain(fxBus,effects);labels();if(effects&&k==='fx')effect('ui');if(!timer)timer=setInterval(tick,70);}catch(e){console.warn('Paws audio unavailable',e);const b=k==='music'?music:fx;b.title='Audio unavailable';b.setAttribute('aria-label','Audio unavailable');}}
 listen(music,'click',e=>{e.stopPropagation();toggle('music');});listen(fx,'click',e=>{e.stopPropagation();toggle('fx');});listen(d,'care',e=>effect(e.detail?.k));
 function stats(){const x=d.querySelectorAll('#stats .stat strong');if(x.length<4)return null;return [parseInt(x[0].textContent,10),parseInt(x[3].textContent,10)];}let before=stats();const statsEl=d.getElementById('stats');let observer=null;if(statsEl){observer=new w.MutationObserver(()=>{const now=stats();if(before&&now){if(now[1]>before[1])effect('adopt');else if(now[0]>before[0])effect('day');}before=now;});observer.observe(statsEl,{childList:true,subtree:true,characterData:true});}
 listen(d,'click',e=>{const b=e.target.closest?.('button');if(!b||b.disabled||controls.contains(b))return;if(b.id==='scooby')effect('pet');else if(b.id==='rescue')effect('rescue');else if(['manage','closePanel','interact','left','right','zoom','resetView'].includes(b.id))effect('ui');},true);
 function visibility(){if(!ctx)return;if(d.hidden||document.hidden){gain(musicBus,false);gain(fxBus,false);}else{gain(musicBus,playing);gain(fxBus,effects);next=ctx.currentTime+.05;ambient=ctx.currentTime+5;if(ctx.state!=='running'&&(playing||effects))ctx.resume().catch(()=>{});}}
 listen(d,'visibilitychange',visibility);listen(document,'visibilitychange',visibility);listen(d,'pointerup',()=>{if(ctx&&(playing||effects)&&ctx.state!=='running')ctx.resume().catch(()=>{});},true);
 cleanup=()=>{alive=false;if(timer)clearInterval(timer);observer?.disconnect();disposers.forEach(f=>f());controls.remove();style.remove();if(old)old.style.removeProperty('display');if(ctx)ctx.close().catch(()=>{});};
}
frame.addEventListener('load',attach);frame.src='paws-v103-community.html';window.addEventListener('pagehide',()=>cleanup());
</script></body></html>
