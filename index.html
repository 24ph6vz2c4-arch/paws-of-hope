<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Łapy Nadziei — gra o schronisku</title><style>
:root{--bg:#f5f1e7;--paper:#fffdf8;--ink:#273a32;--muted:#66756b;--green:#285b47;--mint:#e0eee1;--gold:#f2d39b;--line:#e3e0d5;--red:#a34a38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-weight:650;background:var(--mint);color:var(--green);touch-action:manipulation}button:hover:not(:disabled){filter:brightness(.95)}button:focus-visible{outline:3px solid #bd8434;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--green);color:white}.light{background:#fff5df;color:#735420}.danger{color:var(--red);background:#f5e4dc}.wrap{max-width:1050px;margin:auto;padding:18px 18px 40px}.hero{background:var(--green);color:white;border-radius:22px;padding:25px;position:relative;overflow:hidden}.hero:after{content:'🐾';position:absolute;right:20px;top:-36px;font-size:140px;opacity:.10;transform:rotate(-15deg);pointer-events:none}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:750;opacity:.8}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:9px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0}p{margin:6px 0 12px}.hero p{max-width:610px;color:#e1eae2;margin-bottom:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:23px;display:block;line-height:1.3;font-variant-numeric:tabular-nums}.section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sub{color:var(--muted);font-size:13px}.dogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.dog{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}.portrait{height:107px;display:flex;justify-content:center;align-items:center;background:#eee2c8;position:relative}.portrait svg{height:97px;width:135px}.tag{position:absolute;right:9px;top:9px;border-radius:12px;background:#fffdf2e8;padding:3px 8px;font-size:11px;font-weight:650}.dogbody{padding:12px}.metrics{display:grid;gap:6px;margin:12px 0}.metric{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;gap:6px;font-size:12px}.track{height:7px;background:#eeeae1;border-radius:20px;overflow:hidden}.fill{height:100%;background:#5b9273;border-radius:20px}.fill.low{background:#d7825b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{font-size:12px;padding:9px 5px}.adopt{width:100%;margin-top:8px}.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.columns .section{margin:0}.menu{display:grid;gap:8px}.menuitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.menuitem:last-child{border-bottom:0}.menuitem b{display:block;font-size:14px}.menuitem button{flex-shrink:0;font-size:12px}.log{list-style:none;margin:0;padding:0;max-height:245px;overflow:auto}.log li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.log li:first-child{font-weight:650}.mission{background:#e5eee2;border:1px solid #d2e1d1}.mission p{font-size:13px}.notice{padding:11px 13px;border-radius:10px;background:#fff0ce;color:#755723;margin:12px 0;font-size:13px}.footer{margin-top:15px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.end{min-width:145px}.shop{border:1px dashed #d1b988;padding:12px;border-radius:12px;background:#fffbf0}.shop button{margin-top:5px}.empty{padding:20px;color:var(--muted);text-align:center}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;background:#253d31;color:white;padding:12px 17px;border-radius:12px;z-index:10;box-shadow:0 3px 20px #0002;display:none} @media(max-width:650px){.wrap{padding:10px 10px 30px}.hero{padding:20px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:10px}.columns{grid-template-columns:1fr}.section{padding:13px}.dogs{grid-template-columns:1fr}.end{width:100%}} </style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">Symulator schroniska • prototyp 0.1</div><h1>Łapy Nadziei 🐾</h1><p>Każdy pies zasługuje na drugi dom. Prowadź schronisko, zdobywaj zaufanie zwierząt i pomagaj im znaleźć rodzinę.</p></header><div id="app"></div><div class="footer"><span class="sub" id="saveStatus">Postęp zapisywany lokalnie, jeśli przeglądarka na to pozwala.</span><button class="danger" onclick="resetGame()">Nowa gra</button></div></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script>
'use strict';
const KEY='lapy-nadziei-v1';const names=[['Fado','mieszaniec', '#c58a53','#f2d4a8'],['Pola','terier', '#9a7356','#f0d0ac'],['Borys','labrador', '#d8b579','#f5e1b1'],['Luna','mieszaniec', '#777c82','#e8e3da'],['Tosia','york', '#a98a63','#e6cfab'],['Milo','kundelek', '#ac644c','#f1d4ba'],['Nela','spaniel','#79513d','#e5b992'],['Reksio','mieszaniec','#b4a18b','#f6e8c9'],['Kora','mieszaniec','#555b5f','#e7d5bb']];
function makeDog(i,id,initial=false){const [name,breed,fur,face]=names[i%names.length];return {id,name,breed,fur,face,food:initial?65:35,clean:initial?65:40,health:initial?72:55,happy:initial?45:30,days:0,checked:false};}
function fresh(){return {day:1,money:250,energy:12,capacity:3,rep:0,adopted:0,nextId:3,volunteers:false,dogs:[makeDog(0,1,true),makeDog(1,2,true)],log:['Dzień 1: Otwierasz schronisko. Fado i Pola potrzebują Twojej pomocy.'],fundraised:false,shop:false};}
let s=fresh();try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x&&Array.isArray(x.dogs)&&Number.isFinite(x.day)&&Number.isFinite(x.money))s=x;}}catch(e){}
const cap=n=>Math.max(0,Math.min(100,n));const fmt=n=>Math.round(n).toLocaleString('pl-PL')+' zł';const $=id=>document.getElementById(id);let timer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));$('saveStatus').textContent='Postęp zapisany w tej przeglądarce.';}catch(e){$('saveStatus').textContent='Zapis niedostępny — postęp pozostaje tylko w otwartej grze.';}}
function note(msg){s.log.unshift('Dzień '+s.day+': '+msg);s.log=s.log.slice(0,30);$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',3500);}
function ready(d){return d.food>=70&&d.clean>=70&&d.health>=80&&d.happy>=75&&d.checked&&d.days>=1;}
function metric(label,value){return `<div class="metric"><span>${label}</span><div class="track" role="progressbar" aria-label="${label}" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="100"><div class="fill ${value<45?'low':''}" style="width:${value}%"></div></div><b>${value}</b></div>`;}
function portrait(d){return `<svg viewBox="0 0 140 105" role="img" aria-label="Ilustracja psa"><ellipse cx="70" cy="96" rx="44" ry="5" fill="#000" opacity=".07"/><path d="M40 87 Q38 67 53 62 H87 Q102 70 100 87 Q70 105 40 87" fill="${d.fur}"/><path d="M38 17 Q15 10 13 44 Q15 75 32 63 L48 27 M102 17 Q125 10 127 44 Q125 75 108 63 L92 27" fill="${d.fur}" stroke="#44372d" stroke-width="2"/><ellipse cx="70" cy="45" rx="40" ry="36" fill="${d.fur}" stroke="#44372d" stroke-width="2"/><path d="M65 12 Q52 31 60 43 Q38 49 45 67 Q70 87 95 67 Q102 49 80 43 Q88 31 75 12" fill="${d.face}"/><ellipse cx="52" cy="40" rx="4.7" ry="6" fill="#292924"/><ellipse cx="88" cy="40" rx="4.7" ry="6" fill="#292924"/><circle cx="53" cy="38" r="1.4" fill="white"/><circle cx="89" cy="38" r="1.4" fill="white"/><path d="M60 53 Q70 48 80 53 Q80 60 70 63 Q60 60 60 53" fill="#332d29"/><path d="M70 63 V67 M60 68 Q70 78 80 68" stroke="#332d29" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M49 82 Q70 90 91 82" stroke="#477e62" stroke-width="7" fill="none"/><circle cx="70" cy="91" r="4" fill="#eacb79"/></svg>`;}
function btn(label,cost,energy,id,action,extra=false){return `<button ${s.money<cost||s.energy<energy||extra?'disabled':''} onclick="care(${id},'${action}')">${label}</button>`;}
function dogCard(d){return `<article class="dog"><div class="portrait" style="background:${d.face}66">${portrait(d)}<span class="tag">${ready(d)?'Gotowy do adopcji':d.health<45?'Potrzebuje leczenia':'Pod opieką'}</span></div><div class="dogbody"><h3>${d.name}</h3><div class="sub">${d.breed} · dni w schronisku: ${d.days}</div><div class="metrics">${metric('Najedzenie',d.food)}${metric('Czystość',d.clean)}${metric('Zdrowie',d.health)}${metric('Zaufanie',d.happy)}</div><div class="actions">${btn('🥣 Karma · 8 zł',8,1,d.id,'feed',d.food===100)}${btn('🧼 Sprzątanie',0,1,d.id,'clean',d.clean===100)}${btn('🦮 Spacer',0,1,d.id,'walk',d.happy===100)}${btn('🩺 Wet. · 25 zł',25,1,d.id,'vet',d.health===100&&d.checked)}</div><button class="primary adopt" ${!ready(d)||s.energy<1?'disabled':''} onclick="adopt(${d.id})">🏡 Znajdź odpowiedni dom</button><div class="sub" style="margin-top:6px">${d.checked?'✓ Kontrola weterynaryjna':'Brak kontroli weterynaryjnej'}${ready(d)?' · gotowy na adopcję':''}</div></div></article>`;}
function avg(){return s.dogs.length?Math.round(s.dogs.reduce((a,d)=>a+(d.food+d.clean+d.health+d.happy)/4,0)/s.dogs.length):null;}
function menu(title,desc,label,action,disabled){return `<div class="menuitem"><div><b>${title}</b><span class="sub">${desc}</span></div><button ${disabled?'disabled':''} onclick="${action}">${label}</button></div>`;}
function render(){const a=avg();$('app').innerHTML=`<div class="stats"><div class="stat"><small>📅 Dzień</small><b>${s.day}</b></div><div class="stat"><small>💰 Budżet gry</small><b>${fmt(s.money)}</b></div><div class="stat"><small>⏳ Czas pracy</small><b>${s.energy}/${s.volunteers?15:12}</b></div><div class="stat"><small>🏡 Udane adopcje</small><b>${s.adopted}</b></div></div><section class="section"><div class="row"><h2>Twoje psy (${s.dogs.length}/${s.capacity})</h2><span class="sub">Dobrostan: ${a===null?'—':a+'%'} · Reputacja: ${s.rep}</span></div><div class="dogs">${s.dogs.length?s.dogs.map(dogCard).join(''):'<div class="empty">Wszystkie psy znalazły dom! Możesz przyjąć kolejnego podopiecznego.</div>'}</div><p class="sub" style="margin:12px 0 0">Adopcja: najedzenie i czystość ≥ 70, zdrowie ≥ 80, zaufanie ≥ 75, kontrola weterynaryjna i co najmniej jedna noc w schronisku. Każda czynność kosztuje 1 punkt czasu.</p></section><div class="columns"><section class="section"><h2>Zarządzanie schroniskiem</h2><div class="menu">${menu('🐶 Przyjmij psa','Koszt 15 zł · 1 punkt czasu','Przyjmij','rescue()',s.dogs.length>=s.capacity||s.money<15||s.energy<1)}${menu('📣 Zbiórka społecznościowa','35 zł + premia za reputację · 2 punkty czasu · raz dziennie','Zorganizuj','fundraise()',s.fundraised||s.energy<2)}${menu('🛠️ Nowy kojec','Dodatkowe miejsce · 110 zł · 2 punkty czasu','Rozbuduj','upgrade()',s.money<110||s.energy<2||s.capacity>=7)}${menu('🤝 Program wolontariatu','60 zł · 2 punkty czasu · +3 czasu od jutra','Uruchom','volunteer()',s.volunteers||s.money<60||s.energy<2)}</div></section><section class="section"><h2>Dziennik schroniska</h2><ul class="log">${s.log.map(x=>'<li>'+x+'</li>').join('')}</ul></section></div><section class="section"><div class="row"><div><h2 style="margin:0">Zakończ dzień</h2><div class="sub">Koszty utrzymania: ${10+s.dogs.length*3} zł. Wpływy dzienne: ${30+s.rep*2} zł. Potrzeby psów spadną przez noc.</div></div><button class="primary end" onclick="nextDay()">Następny dzień →</button></div>${s.dogs.some(d=>d.food<50||d.health<45)?'<div class="notice">Niektóre psy wymagają pilnej opieki. Warto pomóc im przed zakończeniem dnia.</div>':''}</section><section class="section mission"><div class="eyebrow" style="color:#285b47">Gra z prawdziwą misją</div><h2 style="margin-top:6px">Wirtualne łapy, realna pomoc</h2><p>Docelowo dobrowolne zakupy kosmetyczne mogą finansować karmę, leczenie i utrzymanie prawdziwych schronisk. Podstawowa gra pozostaje bezpłatna.</p><div class="shop"><b>🎀 Pamiątkowa obroża „Przyjaciel łap”</b><div class="sub">Przykład przyszłego dodatku wspierającego schroniska. Nie zmienia statystyk psów.</div><button class="light" ${s.shop?'disabled':''} onclick="demoShop()">${s.shop?'Wypróbowano — bez płatności':'Wypróbuj dodatek — 0 zł'}</button><p class="sub" style="margin:6px 0 0">To demonstracja: nie pobiera pieniędzy, nie realizuje zakupów i nie przekazuje darowizn. Wszystkie kwoty w grze są wirtualne.</p></div></section>`;save();}
function care(id,action){const d=s.dogs.find(x=>x.id===id);const c={feed:[8,'food',35,'zjadł posiłek'],clean:[0,'clean',40,'ma czyste posłanie'],walk:[0,'happy',30,'cieszy się ze spaceru'],vet:[25,'health',35,'otrzymał opiekę weterynaryjną']}[action];if(!d||!c||s.money<c[0]||s.energy<1)return;s.money-=c[0];s.energy--;d[c[1]]=cap(d[c[1]]+c[2]);if(action==='vet')d.checked=true;note(d.name+' — '+c[3]+'.');render();}
function adopt(id){const d=s.dogs.find(x=>x.id===id);if(!d||!ready(d)||s.energy<1)return;s.energy--;s.adopted++;s.rep+=3;s.dogs=s.dogs.filter(x=>x.id!==id);note(d.name+' znalazł bezpieczny, sprawdzony dom! Reputacja +3.');render();}
function rescue(){if(s.dogs.length>=s.capacity||s.money<15||s.energy<1)return;s.money-=15;s.energy--;const id=s.nextId++;const d=makeDog((id-1)%names.length,id);s.dogs.push(d);note('Przyjęto psa: '+d.name+'. Potrzebuje jedzenia, opieki i zaufania.');render();}
function fundraise(){if(s.fundraised||s.energy<2)return;s.energy-=2;s.fundraised=true;const amount=35+s.rep*3;s.money+=amount;note('Społeczność wsparła schronisko kwotą '+fmt(amount)+' (w grze).');render();}
function upgrade(){if(s.money<110||s.energy<2||s.capacity>=7)return;s.money-=110;s.energy-=2;s.capacity++;note('Zbudowano kolejny kojec. Pojemność: '+s.capacity+'.');render();}
function volunteer(){if(s.volunteers||s.money<60||s.energy<2)return;s.money-=60;s.energy-=2;s.volunteers=true;note('Wolontariusze dołączą od jutra. Otrzymasz 3 dodatkowe punkty czasu.');render();}
function nextDay(){if(s.dogs.some(d=>d.food<50||d.health<45)&&!confirm('Niektóre psy wymagają opieki. Czy na pewno zakończyć dzień?'))return;const cost=10+s.dogs.length*3, income=30+s.rep*2;s.money+=income-cost;s.day++;s.energy=s.volunteers?15:12;s.fundraised=false;s.dogs.forEach(d=>{d.days++;d.food=cap(d.food-20);d.clean=cap(d.clean-15);d.happy=cap(d.happy-10);if(d.food<35||d.clean<30)d.health=cap(d.health-12);else if(d.food>=60&&d.clean>=60)d.health=cap(d.health+3);});note('Nowy dzień. Wsparcie: '+fmt(income)+', utrzymanie: '+fmt(cost)+'.');if(s.money<8){s.money+=30;note('Wirtualny fundusz awaryjny przekazał 30 zł na karmę.');}if(s.day===3){note('Sąsiedzi przekazali dodatkowe koce i 20 zł (w grze).');s.money+=20;}render();}
function demoShop(){if(s.shop)return;s.shop=true;note('Dodatek demonstracyjny aktywowany. Nie dokonano żadnej płatności.');render();}
function resetGame(){if(!confirm('Czy rozpocząć od nowa? Dotychczasowy postęp zostanie zastąpiony.'))return;s=fresh();render();}
render();</script></body></html>
